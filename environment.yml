# Conda environment for the VEG-05 integrated omics pipeline (unpinned).
# renv.lock (R) and requirements.txt (Python) record the exact versions used
# for the October 2026 re-runs; this file has not been tested with conda.
name: veg05-omics
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.4
  - r-biocmanager
  # Bioconductor
  - bioconductor-dada2
  - bioconductor-phyloseq
  - bioconductor-biostrings
  - bioconductor-deseq2
  - bioconductor-apeglm
  - bioconductor-aldex2
  - bioconductor-complexheatmap
  - bioconductor-clusterprofiler
  - bioconductor-enrichplot
  - bioconductor-mofa2
  # CRAN
  - r-ashr
  - r-circlize
  - r-vegan
  - r-wgcna
  - r-reticulate
  - r-ggplot2
  - r-svglite
  - r-dplyr
  - r-tidyr
  # Python
  - python>=3.9
  - cutadapt
  - matplotlib
  - numpy
  - pandas
  - pillow
  - pip
  - pip:
      - mofapy2==0.7.5
      - python-docx
      - python-pptx
